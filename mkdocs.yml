          - '2. DDL y Restricciones (Oracle)': 2-curso/asgbd/02-diseno-fisico-ddl-oracle.md
          - '3. Consultas Multitabla (JOINs)': 2-curso/asgbd/03-consultas-avanzadas-joins.md
          - '4. Agrupamiento y Funciones Grupo': 2-curso/asgbd/04-agrupamiento-funciones-grupo.md
          - '5. Subconsultas en SQL': 2-curso/asgbd/05-subconsultas.md
