site_name: Apuntes ASIR
site_description: Repositorio estructurado de apuntes, laboratorios prácticos y preparación de exámenes para el CFGS ASIR
site_author: Daniel Silva
repo_name: JohnDSil/apuntes_asir
repo_url: https://github.com/JohnDSil/apuntes_asir
edit_uri: ""

theme:
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    # Modo Claro (Limpio y legible)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Modo Oscuro (Slate)
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - '📚 Inicio': index.md
  - '📘 1º Curso':
      - 'Visión General': 1-curso/index.md
      - 'Implantación de SO (ISO)': 1-curso/iso.md
      - 'Redes (PAR)': 1-curso/redes.md
      - 'Bases de Datos (GBD)': 1-curso/bbdd.md
      - 'Fundamentos de Hardware (FH)': 1-curso/hardware.md
      - 'Lenguajes de Marcas (LMSGI)': 1-curso/marcas.md
  - '🛡️ Seguridad (SAD)':
      - 'Visión General': 2-curso/sad/index.md
      - 'UT1: Fundamentos de Seguridad': 2-curso/sad/01-fundamentos-seguridad.md
      - 'UT2: Seguridad Física, SAI y Backups': 2-curso/sad/02-seguridad-fisica-sai-backup.md
      - 'UT3: Control de Acceso y Criptografía': 2-curso/sad/03-control-acceso-criptografia.md
      - 'UT4: Amenazas, Vulnerabilidades y Forense': 2-curso/sad/04-amenazas-vulnerabilidades-forense.md
      - 'UT5: Marco Legal — RGPD y AEPD': 2-curso/sad/05-marco-legal-rgpd-aepd.md
  - '💻 Sistemas (ASO)':
      - 'Visión General': 2-curso/aso/index.md
      - '1. Scripting en Bash y CLI': 2-curso/aso/01-scripting-bash.md
      - '2. Scripting Gráfico con Zenity': 2-curso/aso/02-zenity-gui-scripting.md
      - '3. Programación de Tareas (cron/systemd)': 2-curso/aso/03-programacion-tareas-cron-systemd.md
  - '🗄️ Bases de Datos (ASGBD)':
      - 'Visión General': 2-curso/asgbd/index.md
      - '1. Docker y Contenedores': 2-curso/asgbd/01-docker-sgbd.md
      - '2. DDL y Restricciones (Oracle)': 2-curso/asgbd/02-diseno-fisico-ddl-oracle.md
      - '3. Consultas Multitabla (JOINs)': 2-curso/asgbd/03-consultas-avanzadas-joins.md
      - '4. Agrupamiento y Funciones Grupo': 2-curso/asgbd/04-agrupamiento-funciones-grupo.md
      - '5. Subconsultas en SQL': 2-curso/asgbd/05-subconsultas.md
      - '6. DML y Transacciones ACID': 2-curso/asgbd/06-dml-transacciones.md
      - '7. Administración Oracle y PL/SQL': 2-curso/asgbd/07-administracion-oracle-plsql.md
  - '🌐 Aplicaciones Web (IAW)':
      - 'Visión General': 2-curso/iaw/index.md
      - '1. Fundamentos Web y Cliente-Servidor': 2-curso/iaw/01-fundamentos-web-arquitectura-cliente-servidor.md
      - '2. Protocolo HTTP y Formularios': 2-curso/iaw/02-protocolo-http-formularios.md
      - '3. Programación Backend con PHP': 2-curso/iaw/03-programacion-servidor-php.md
      - '4. Despliegue Web y Docker': 2-curso/iaw/04-despliegue-servidores-web-docker.md
  - '♾️ DevOps':
      - 'Visión General': 2-curso/devops/index.md
      - 'UD1: Introducción a DevOps': 2-curso/devops/ud1-introduccion.md
      - 'UD2: Git, Markdown y GitHub': 2-curso/devops/ud2-git-markdown.md
      - 'UD3: Monitorización de Sistemas': 2-curso/devops/ud3-monitorizacion.md
  - '📂 Otros':
      - 'Servicios de Red (SRI)': 2-curso/sri.md
      - 'Inglés Profesional': 2-curso/ingles.md
